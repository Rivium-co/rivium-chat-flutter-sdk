name: rivium_chat_ecommerce_example
description: A comprehensive e-commerce example app demonstrating all RiviumChat SDK features.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # RiviumChat SDK packages
  rivium_chat:
    path: ../rivium_chat_core
  rivium_chat_ui:
    path: ../rivium_chat_ui
  rivium_push: ^0.1.2

  # UI dependencies
  cached_network_image: ^3.4.1
  intl: ^0.19.0

  # File handling (for upload example)
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  http: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
